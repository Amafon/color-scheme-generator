<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Color Scheme Generator</title>
  </head>
  <body>
    <section class="section-colors">
      <form action="">
        <input
          class="custom-color-picker"
          type="color"
          name="color-picker"
          id="color-picker"
        />
        <select name="color-mode" id="color-mode">
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome-dark</option>
          <option value="monochrome-light">Monochrome-light</option>
          <option value="analogic">Analogic</option>
          <option value="complement">Complement</option>
          <option value="analogic-complement">Analogic-complement</option>
          <option value="triad">Triad</option>
        </select>
        <button type="submit" id="button">Generator color scheme</button>
      </form>
      <div class="colors-grid" id="colors-grid">
        <div class="color-block">
          <div class="color-fluid" style="background-color: #eeb876"></div>
          <div class="color-hex">#eeb876</div>
        </div>
